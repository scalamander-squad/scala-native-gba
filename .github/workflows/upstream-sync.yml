# Weekly upstream sync for the fork.
#
# Merges scala-native/scala-native `main` into a dated branch `upstream-sync/<date>` (merge commit, never rebase),
# runs the JVM tool tests, and opens a PR to the fork's `main`. On a merge conflict it aborts the merge and opens
# (or updates) an issue labelled `upstream-sync` listing the conflicting files and the upstream range.
#
# TOKEN: the default GITHUB_TOKEN cannot push commits that touch `.github/workflows/**`, and upstream merges often
# do. Add a repository secret `UPSTREAM_SYNC_TOKEN` (a PAT with `repo` and `workflow` scopes). It is used when set,
# otherwise GITHUB_TOKEN. If the push is rejected, the job opens an issue explaining this instead of failing silently.
# Opening PRs with GITHUB_TOKEN also needs Settings > Actions > "Allow GitHub Actions to create and approve pull
# requests" (not needed with the PAT).
#
# After the JVM tests it publishes the merged fork locally, builds the GBA test ROM (gba-testrom/) and runs it headless in
# libmgba; the verdict goes into the PR body (a failing ROM opens an issue instead of a PR). The ROM is never uploaded.
# Not covered here: the game's device checks and the `-gbaN` version bump; do those locally after merging the PR
# (see README-FORK.md, "Merging upstream").
name: Upstream sync

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      base:
        description: "Fork branch to update"
        default: main
        required: true
      dry_run:
        description: "Report what would happen; do not push, open PRs or issues"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'scala-native/scala-native'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      BASE: ${{ inputs.base || 'main' }}
      DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
      GH_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}
      JAVA_TOOL_OPTIONS: -Xss16m
      ARM_GNU_VERSION: 14.3.rel1 # GBA test ROM toolchain (Arm GNU, matches the local builds)
      MGBA_VERSION: 0.10.5 # libmgba for the headless test ROM run
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.base || 'main' }}
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Fetch upstream and merge
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/scala-native/scala-native
          git fetch --no-tags upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Nothing new upstream."
            echo "state=uptodate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          short=$(git rev-parse --short upstream/main)
          branch="upstream-sync/$(date -u +%F)"
          range="$(git rev-parse --short HEAD)..$short"
          {
            echo "short=$short"
            echo "branch=$branch"
            echo "range=$range"
          } >> "$GITHUB_OUTPUT"
          git log --no-merges --format='- %h %s' HEAD..upstream/main | head -100 > "$RUNNER_TEMP/commits.md"
          git checkout -b "$branch"
          if git merge --no-ff -m "Merge upstream main $short" upstream/main; then
            echo "state=clean" >> "$GITHUB_OUTPUT"
            echo "Clean merge of $range"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "state=conflict" >> "$GITHUB_OUTPUT"
            echo "Conflicts merging $range:"; cat "$RUNNER_TEMP/conflicts.txt"
          fi

      - name: Dry run report
        if: env.DRY_RUN == 'true' && steps.merge.outputs.state != 'uptodate'
        run: |
          echo "DRY RUN: merge of upstream ${{ steps.merge.outputs.range }} is ${{ steps.merge.outputs.state }}."
          echo "Would push ${{ steps.merge.outputs.branch }} and open a PR to $BASE (clean), or an issue (conflict)."
          echo "Upstream commits:"; cat "$RUNNER_TEMP/commits.md"
          [ -f "$RUNNER_TEMP/conflicts.txt" ] && { echo "Conflicting files:"; cat "$RUNNER_TEMP/conflicts.txt"; }
          exit 0

      - name: Open or update conflict issue
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'conflict'
        run: |
          gh label create upstream-sync --color 0E8A16 --description "Upstream merge needs attention" 2>/dev/null || true
          {
            echo "Merging upstream \`main\` (\`${{ steps.merge.outputs.range }}\`) into \`$BASE\` conflicts."
            echo
            echo "Conflicting files:"; sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Resolve locally: \`git fetch origin main && git merge origin/main\` (merge, never rebase), then see README-FORK.md, \"Merging upstream\"."
            echo
            echo "Upstream commits:"; cat "$RUNNER_TEMP/commits.md"
            echo
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          n=$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number // empty')
          if [ -n "$n" ]; then
            gh issue edit "$n" --title "Upstream sync conflict: ${{ steps.merge.outputs.range }}" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --label upstream-sync --title "Upstream sync conflict: ${{ steps.merge.outputs.range }}" --body-file "$RUNNER_TEMP/issue.md"
          fi

      - name: Set up JDK 17 and sbt
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        uses: coursier/cache-action@v8
      - if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        uses: coursier/setup-action@v3
        with:
          jvm: "17"
          apps: sbt

      - name: Test tools (Scala 3.9.0)
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        run: sbt -batch "++3.9.0; toolsJVM3/testFull"

      - name: Test fork classes (Scala 2.13)
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        run: >
          sbt -batch "toolsJVM2_13/testOnly
          scala.scalanative.romdata.ArrayEscapeTest
          scala.scalanative.optimizer.StableModuleFieldsTest
          scala.scalanative.optimizer.InlineUnderTryTest
          scala.scalanative.optimizer.DuplicateUnusedParamsTest
          scala.scalanative.codegen.MemoryLayoutTest"

      # ---- GBA test ROM: publish the merged fork locally, build gba-testrom/ and run it headlessly in libmgba ----
      # The ROM and ELF stay on the runner (gba-testrom/out/ is gitignored); only the log and verdict are reported.
      - name: Cache Arm GNU toolchain and libmgba
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        uses: actions/cache@v4
        with:
          path: |
            ~/arm-gnu-toolchain
            ~/mgba-build
          key: gba-testrom-${{ runner.os }}-${{ runner.arch }}-arm-${{ env.ARM_GNU_VERSION }}-mgba-${{ env.MGBA_VERSION }}

      - name: Install GBA test ROM toolchain (clang, Arm GNU 14.3.rel1, libmgba 0.10.5)
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends clang cmake
          clang --version | head -1
          if [ ! -x ~/arm-gnu-toolchain/bin/arm-none-eabi-gcc ]; then
            mkdir -p ~/arm-gnu-toolchain
            curl -fsSL "https://developer.arm.com/-/media/Files/downloads/gnu/$ARM_GNU_VERSION/binrel/arm-gnu-toolchain-$ARM_GNU_VERSION-x86_64-arm-none-eabi.tar.xz" \
              | tar -xJ --strip-components=1 -C ~/arm-gnu-toolchain
          fi
          echo "$HOME/arm-gnu-toolchain/bin" >> "$GITHUB_PATH"
          ~/arm-gnu-toolchain/bin/arm-none-eabi-gcc --version | head -1
          git clone -q --depth 1 --branch "$MGBA_VERSION" https://github.com/mgba-emu/mgba ~/mgba-src
          if [ ! -f ~/mgba-build/libmgba.a ]; then
            cmake -S ~/mgba-src -B ~/mgba-build -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_BUILD_TYPE=Release \
              -DBUILD_STATIC=ON -DBUILD_SHARED=OFF -DBUILD_QT=OFF -DBUILD_SDL=OFF -DBUILD_LTO=OFF -DBUILD_PERF=OFF \
              -DBUILD_TEST=OFF -DBUILD_SUITE=OFF -DBUILD_CINEMA=OFF -DBUILD_EXAMPLE=OFF -DBUILD_ROM_TEST=OFF \
              -DBUILD_LIBRETRO=OFF -DBUILD_GL=OFF -DBUILD_GLES2=OFF -DBUILD_GLES3=OFF -DM_CORE_GB=OFF -DUSE_LUA=OFF \
              -DUSE_PNG=OFF -DUSE_ZLIB=OFF -DUSE_LIBZIP=OFF -DUSE_MINIZIP=OFF -DUSE_LZMA=OFF -DUSE_SQLITE3=OFF \
              -DUSE_ELF=OFF -DUSE_FFMPEG=OFF -DUSE_DEBUGGERS=OFF -DUSE_GDB_STUB=OFF -DUSE_EDITLINE=OFF \
              -DUSE_EPOXY=OFF -DUSE_DISCORD_RPC=OFF > /dev/null
            make -C ~/mgba-build -j"$(nproc)" mgba > /dev/null
          fi

      - name: Publish the merged fork locally (Scala 3.9.0 artifacts)
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        timeout-minutes: 30
        env:
          SBT_OPTS: -Xmx6G -Xss4M -XX:+UseParallelGC
        # Without CI in the environment the build's version is <baseVersion>-<localForkTag> (project/ScalaNativeBuildInfo.scala),
        # the version gba-testrom/build.sh resolves; these are the Scala 3 commands of the local publish script.
        run: >
          env -u CI sbt -batch "++3.9.0;
          nscplugin3/publishLocal; nirJVM3/publishLocal; utilJVM3/publishLocal;
          nativelib3/publishLocal; clib3/publishLocal; posixlib3/publishLocal; windowslib3/publishLocal;
          javalib3/publishLocal; auxlib3/publishLocal; scalalib3/publishLocal; scala3lib3/publishLocal;
          toolsJVM3/publishLocal"

      - name: Build and run the GBA test ROM (headless mGBA)
        id: testrom
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        continue-on-error: false
        timeout-minutes: 15
        env:
          MGBA_LIBS: -lm -lpthread
        run: |
          export MGBA_SRC="$HOME/mgba-src" MGBA_BUILD="$HOME/mgba-build"
          set -o pipefail
          gba-testrom/build.sh 2>&1 | grep -vE 'RWX|GNU-stack|deprecated|__sync_synchronize|sync-\{|avoid this warning|garbage collection' | tee "$RUNNER_TEMP/testrom-build.log"
          status=0
          gba-testrom/run.sh 2>&1 | tee "$RUNNER_TEMP/testrom.log" || status=$?
          echo "verdict=$(grep -m1 '^VERDICT:' "$RUNNER_TEMP/testrom.log" | sed 's/^VERDICT: //')" >> "$GITHUB_OUTPUT"
          echo "summary=$(grep -m1 'TESTROM ' "$RUNNER_TEMP/testrom.log" | sed 's/^\[rom\] //')" >> "$GITHUB_OUTPUT"
          exit $status

      - name: Report GBA test ROM failure
        if: failure() && env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean' && steps.testrom.outcome == 'failure'
        run: |
          gh label create upstream-sync --color 0E8A16 2>/dev/null || true
          {
            echo "The upstream merge (\`${{ steps.merge.outputs.range }}\`) is clean and the JVM tests pass, but the GBA test ROM (\`gba-testrom/\`) did not pass: ${{ steps.testrom.outputs.verdict || 'build failed' }}"
            echo; echo "Checks that failed (from the mGBA debug log):"; echo '```'
            grep -E '^\[rom\] (FAIL|halt)|^VERDICT|^result block' "$RUNNER_TEMP/testrom.log" 2>/dev/null || tail -40 "$RUNNER_TEMP/testrom-build.log"
            echo '```'
            echo "The branch was not pushed. Reproduce locally: see README-FORK.md, \"GBA test ROM\"."
            echo; echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --label upstream-sync --title "Upstream sync: GBA test ROM failed on ${{ steps.merge.outputs.range }}" --body-file "$RUNNER_TEMP/issue.md"

      - name: Push branch and open PR
        if: env.DRY_RUN != 'true' && steps.merge.outputs.state == 'clean'
        run: |
          branch="${{ steps.merge.outputs.branch }}"
          if ! git push origin "$branch" 2> "$RUNNER_TEMP/push.err"; then
            cat "$RUNNER_TEMP/push.err"
            gh label create upstream-sync --color 0E8A16 2>/dev/null || true
            {
              echo "The upstream merge (\`${{ steps.merge.outputs.range }}\`) is clean and tests pass, but pushing \`$branch\` was rejected:"
              echo; echo '```'; cat "$RUNNER_TEMP/push.err"; echo '```'
              echo
              echo "If this mentions \`workflow\` scope, GITHUB_TOKEN cannot push commits that change \`.github/workflows/**\`."
              echo "Add a repository secret \`UPSTREAM_SYNC_TOKEN\` (PAT with \`repo\` + \`workflow\` scopes), or merge locally."
              echo
              echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            } > "$RUNNER_TEMP/issue.md"
            gh issue create --label upstream-sync --title "Upstream sync push rejected: ${{ steps.merge.outputs.range }}" --body-file "$RUNNER_TEMP/issue.md"
            exit 1
          fi
          {
            echo "Merge of upstream \`main\` (\`${{ steps.merge.outputs.range }}\`) into \`$BASE\`. Clean merge; \`toolsJVM3/testFull\` (Scala 3.9.0) and the fork test classes (toolsJVM2_13) pass."
            echo
            echo "GBA test ROM (\`gba-testrom/\`, built with the merged fork published locally, run headless in libmgba 0.10.5): **${{ steps.testrom.outputs.verdict }}** — ${{ steps.testrom.outputs.summary }}"
            echo; echo "<details><summary>Test ROM log</summary>"; echo; echo '```'
            grep -E '^\[rom\]|^VERDICT|^result block' "$RUNNER_TEMP/testrom.log"
            echo '```'; echo "</details>"
            echo
            echo "Not checked here: the game's device checks (play ROM, lockstep equivalence, boot to Birch) and the \`-gbaN\` version bump; do these locally before/after merging."
            echo
            echo "Upstream commits:"; cat "$RUNNER_TEMP/commits.md"
          } > "$RUNNER_TEMP/pr.md"
          gh pr create --base "$BASE" --head "$branch" --title "Merge upstream main ${{ steps.merge.outputs.short }}" --body-file "$RUNNER_TEMP/pr.md"
